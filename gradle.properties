android.useAndroidX=true
android.nonTransitiveRClass=true
# 基础 JVM 堆配置：GitHub Actions 7G 内存给 3G；-Xms 和 -XX 保守即可，允许外部覆盖
org.gradle.jvmargs=-XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
# Cronet 依赖版本：若 build.gradle 未声明则使用本默认
CronetVersion=128.0.6613.40
CronetMainVersion=128
