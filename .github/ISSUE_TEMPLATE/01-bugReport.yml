name: BUG提交 / BUG Report
description: Report bugs to developers
labels: ["BUG"]
body:
  - type: checkboxes
    attributes:
      label: 确认 / Assignments
      description: 提交issue请确保完成以下前提，否则该issue可能被忽略 / Make sure you read checkboxs below
      options:
        - label: 搜索现有issues，不存在相似或相关的issue / No similar or related issues
          required: true
        - label: 已更新到[最新版](https://github.com/Kdkdmwnwdkd/-legado-build/releases/latest)，问题依然存在 / Problem persists on the latest release
          required: true
        - label: 此问题和Xposed、Lsposed、Magisk、手机主题、浏览器插件、无障碍服务等无关 / Make sure your machine is not touched by hook frameworks, plugins, accessibility etc
          required: true

  - type: textarea
    attributes:
      label: 问题描述 / Describe Bugs
      description: |
        提交前请确认已更新到最新版。请尽量写清复现条件：哪本书、哪个书源、
        哪一步操作之后出现，有稳定复现路径的最好。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / How to reproduce
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 确认 / Assignment
      options:
        - label: 已经提交复现所需要的附加资料 / Submit additions related with bugs
          required: true
  - type: textarea
    attributes:
      label: 其他信息 / Additions
      description: |
        反馈WEB书架前端问题时请提供浏览器版本信息，如Edge 129.0.2792.89
      placeholder: "请用```将提交的内容包裹"

  - type: textarea
    attributes:
      label: 日志提交 / Relevant log output
      description: |
        日志位于 我的-关于-崩溃日志、保存日志，或书架-右上角-日志，也可以自行用 log 工具抓取
        如果崩溃日志中包含`java.lang.OutOfMemoryError`，请在其他设置里打开记录堆转储，复现崩溃后到关于页面点保存日志，再把备份目录下 heapDump 文件夹里的文件打包上传
      placeholder: "请用```将日志内容包裹"

  - type: input
    attributes:
      label: 版本 / Version
      placeholder: "3.26.10272145"
    validations:
      required: true
  - type: input
    attributes:
      label: Android版本 / Android version
      placeholder: "Android 12"
    validations:
      required: true
  - type: input
    attributes:
      label: 机型 / Model
      placeholder: "Redmi K30 Pro"
    validations:
      required: true
