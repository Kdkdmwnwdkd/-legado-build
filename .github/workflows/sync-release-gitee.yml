name: Sync Release To Gitee

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to sync. Leave empty to use the latest release.
        required: false
        default: ""
      sync_update_channel:
        description: Also sync latest-arm64-release update channel.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: gitee-release-sync
  cancel-in-progress: false

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release sync behavior
        run: python3 -m unittest discover -s tools/tests -p test_sync_gitee_release.py -v

      - name: Sync and verify Gitee downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG_INPUT: ${{ inputs.tag_name }}
          SYNC_CHANNEL: ${{ inputs.sync_update_channel }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TAG_INPUT" ]; then
            args+=(--tag "$TAG_INPUT")
          fi
          if [ "$SYNC_CHANNEL" != "true" ]; then
            args+=(--skip-channel)
          fi
          python3 tools/sync_gitee_release.py "${args[@]}" --publish
