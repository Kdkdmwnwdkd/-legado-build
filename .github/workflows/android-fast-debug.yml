name: Nightly Debug

# 只发布到固定的 nightly 标签，绝不按「最新 release」定位，
# 避免把正式版的 APK 和说明覆盖掉。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-debug-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Tune memory for CI
        # 37 万行 Kotlin + Compose/KSP，标准 runner 默认堆会 GC overhead limit exceeded
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      # 有正式签名就用，没有就退回 Android 默认 debug 签名。
      # 两种签名不能互相升级，装 nightly 前请先卸载正式版（或反之）。
      - name: Configure signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 KEYSTORE_B64，本次使用默认 debug 签名。"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          {
            echo ""
            echo "RELEASE_STORE_FILE=$KEYSTORE"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Build arm64 debug APK
        run: |
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          ./gradlew :app:assembleAppDebug \
            -Pabi=arm64-v8a \
            -PVERSION_NAME="3.$(TZ=Asia/Shanghai date +%y.%m%d%H%M)-nightly" \
            -PVERSION_CODE="$VERSION_CODE" \
            --max-workers=2 \
            --stacktrace

      - name: Resolve APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          APK_NAME=$(basename "$APK_PATH")
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly"
          cat > notes.md <<EOF
          阅读Shimmer 每日构建（调试版）

          - Commit: ${{ github.sha }}
          - 分支: ${{ github.ref_name }}
          - APK: ${{ steps.apk.outputs.name }}
          - 构建时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          调试版与正式版签名不同，安装前请先卸载另一个版本。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
              --jq '.assets[] | select(.name | endswith(".apk")) | .id' \
              | while read -r id; do
                  [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
                done
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "阅读Shimmer 每日构建" \
              --notes-file notes.md \
              --prerelease
          fi
