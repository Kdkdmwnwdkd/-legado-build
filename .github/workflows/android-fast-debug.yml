name: Nightly Build

# 只发布到固定的 nightly 标签，绝不按「最新 release」定位，
# 避免把正式版的 APK 和说明覆盖掉。
#
# 默认出 release 包：debug 包带 debuggable=true 且内置 Compose tooling，
# 装到手机上明显发涩，不适合日常读。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型（release 流畅，debug 方便抓日志）"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-debug-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Tune memory for CI
        # 37 万行 Kotlin + Compose/KSP，标准 runner 默认堆会 GC overhead limit exceeded
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      # 有正式签名就用，没有就退回 Android 默认 debug 签名。
      # 两种签名不能互相升级，装 nightly 前请先卸载正式版（或反之）。
      - name: Configure signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
              echo "未配置 KEYSTORE_B64，本次使用默认 debug 签名。"
              exit 0
            fi
            echo "::error::release 包必须有签名，请配置 secrets.KEYSTORE_B64（或把 build_type 选成 debug）。"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          {
            echo ""
            echo "RELEASE_STORE_FILE=$KEYSTORE"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Prepare Gradle distribution
        # GitHub 的 gradle-distributions release 资产偶发 504，
        # 官方源探测失败就切国内镜像，避免整条流水线卡在 wrapper 下载。
        run: |
          OFFICIAL="https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          MIRRORS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.6.0-bin.zip"
            "https://repo.huaweicloud.com/gradle/gradle-9.6.0-bin.zip"
          )
          probe() { curl -fsL -r 0-65535 --max-time 25 -o /dev/null "$1"; }
          if probe "$OFFICIAL"; then
            echo "官方源可用"
            exit 0
          fi
          for M in "${MIRRORS[@]}"; do
            if probe "$M"; then
              echo "切换镜像: $M"
              sed -i "s#^distributionUrl=.*#distributionUrl=${M}#" gradle/wrapper/gradle-wrapper.properties
              exit 0
            fi
          done
          echo "所有源均不可用，交给 wrapper 自行重试"

      - name: Use Maven mirror
        # 配合上一步：Maven Central 的 JetBrains 构件会 302 到 GitHub，
        # 同样受 504 影响，这里换成国内镜像（仓库数量与 content 过滤不变）。
        run: |
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH/init.d"
          cp .github/ci/mirrors.gradle "$GUH/init.d/99-mirrors.gradle"
          echo "Maven 镜像兜底已启用: $GUH/init.d/99-mirrors.gradle"


      - name: Build arm64 APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK=assembleAppDebug
          else
            TASK=assembleAppRelease
          fi
          echo "构建类型: $BUILD_TYPE ($TASK)"
          ./gradlew ":app:${TASK}" \
            -Pabi=arm64-v8a \
            -PVERSION_NAME="3.$(TZ=Asia/Shanghai date +%y.%m%d%H%M)-nightly" \
            -PVERSION_CODE="$VERSION_CODE" \
            --max-workers=2 \
            --stacktrace

      - name: Resolve APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          APK_NAME=$(basename "$APK_PATH")
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly"
          cat > notes.md <<EOF
          阅读Shimmer 每日构建（${{ inputs.build_type || 'release' }}）

          - Commit: ${{ github.sha }}
          - 分支: ${{ github.ref_name }}
          - APK: ${{ steps.apk.outputs.name }}
          - 构建时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          包名 io.legado.app.shimmer。与已安装的正式版同签名时可直接覆盖升级；
          若提示签名冲突，先卸载旧包再装（数据请提前备份）。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
              --jq '.assets[] | select(.name | endswith(".apk")) | .id' \
              | while read -r id; do
                  [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
                done
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "阅读Shimmer 每日构建" \
              --notes-file notes.md \
              --prerelease
          fi
