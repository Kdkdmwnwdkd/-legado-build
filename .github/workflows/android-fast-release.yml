name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，留空则自动使用 3.yy.MMddHHmm"
        required: false
        default: ""

permissions:
  contents: write

# 同一时间只允许一个发布在跑
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_B64。请按 README「发布准备」上传签名库，仓库里不再保存任何密钥。"
            exit 1
          fi

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"
          {
            echo ""
            echo "RELEASE_STORE_FILE=$KEYSTORE"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Prepare version
        id: v
        run: |
          VERSION_NAME="${{ inputs.version }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="3.$(TZ=Asia/Shanghai date +%y.%m%d%H%M)"
          fi
          # 与 app/build.gradle 默认值一致：epoch 分钟
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION_NAME ($VERSION_CODE)"

      - name: Build arm64-v8a
        run: |
          chmod +x gradlew
          mkdir -p release-apks
          ./gradlew :app:assembleAppRelease \
            -Pabi=arm64-v8a \
            -PVERSION_NAME="${{ steps.v.outputs.name }}" \
            -PVERSION_CODE="${{ steps.v.outputs.code }}" \
            --stacktrace
          APK=$(find app/build/outputs/apk/app/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "release-apks/shimmer-arm64-v8a_app_${{ steps.v.outputs.name }}_${{ steps.v.outputs.code }}.apk"

      - name: Build armeabi-v7a
        run: |
          ./gradlew :app:clean
          ./gradlew :app:assembleAppRelease \
            -Pabi=armeabi-v7a \
            -PVERSION_NAME="${{ steps.v.outputs.name }}" \
            -PVERSION_CODE="${{ steps.v.outputs.code }}" \
            --stacktrace
          APK=$(find app/build/outputs/apk/app/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "release-apks/shimmer-armeabi-v7a_app_${{ steps.v.outputs.name }}_${{ steps.v.outputs.code }}.apk"

      - name: Verify signature
        run: |
          APK=$(find release-apks -type f -name '*arm64-v8a*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | head -n 5

      - name: Build release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import re
          text = open('CHANGELOG.md', encoding='utf-8').read()
          parts = re.split(r'(?m)^##\s+', text)
          body = ''
          for part in parts[1:]:
              candidate = '## ' + part.strip()
              if candidate.strip() == '##':
                  continue
              body = candidate
              break
          if len(body) < 40:
              raise SystemExit('CHANGELOG.md 中未找到可用的版本段落，请先补充更新日志')
          open('release-notes.md', 'w', encoding='utf-8').write(body + '\n')
          PY
          head -n 20 release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shimmer-release-${{ steps.v.outputs.name }}
          path: release-apks/*.apk

      # 产物命名必须保持 <任意>_<任意>_<版本>_<版本号>.apk：
      # 应用内更新靠这个格式解析版本与 ABI；名称里也不能出现 release 字样，
      # 否则会被识别成内测包并被过滤掉。
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shimmer-v${{ steps.v.outputs.name }}
          name: 阅读Shimmer ${{ steps.v.outputs.name }}
          body_path: release-notes.md
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
