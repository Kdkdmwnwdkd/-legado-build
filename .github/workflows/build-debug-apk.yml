name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (app flavor only, arm64 ABI)
        run: |
          set -o pipefail
          ./gradlew assembleAppDebug -Pabi=arm64-v8a --no-daemon --max-workers=2 --stacktrace 2>&1 | tee build_output.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build_output.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Upload APK to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-debug
          name: Nightly Debug Build
          body: |
            ## 阅读Shimmer Nightly Debug
            自动构建产物，包含**备份修复**（WebDAV未配置时跳过云端，本地备份正常）。
            - Commit: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - Actions 已升级到 Node24 版本
          files: |
            app/build/outputs/apk/**/*.apk
          overwrite_files: true
          update_existing: true
