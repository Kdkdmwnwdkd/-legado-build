name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Build web frontend
        run: |
          cd modules/web
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (app flavor only, arm64 ABI)
        run: |
          set -o pipefail
          ./gradlew assembleAppDebug -Pbi=arm64-v8a --no-daemon --max-workers=2 --stacktrace 2>&1 | tee build_output.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build_output.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Upload APK to GitHub Releases
        if: success

        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-debug
          name: Nightly Debug Build
          body: |
            ## 阅读Shimmer Nightly Debug
            稳客性修复��
            - 修复阅读页彑廜监听未注册，切网后进度不同步
            - 修复 Cronet POST 上传袛提前儶闭、重放崩溃