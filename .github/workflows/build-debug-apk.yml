name: Build Debug APK

# 在 GitHub 16G 内存的 Ubuntu runner 上编译，跑完把 APK 作为 Release 公开附件发布，
# 手机浏览器点链接即可直接下载 .apk 安装（无需解压、无需登录）。
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限来创建 Release 并上传 APK 附件

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build App Debug APK (arm64-v8a, default debug signing)
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-XX:+UseParallelGC -Xmx4g -Xms512m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
            -Dorg.gradle.workers.max=2
        run: |
          ./gradlew :app:assembleAppDebug \
            -Pabi=arm64-v8a \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-archive-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases (public direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: 阅读Archive Debug #${{ github.run_number }} (含听书跟随翻页)
          body: |
            自动构建 · 含"听书跟随翻页"功能 (arm64-v8a, 默认 debug 签名)
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
