name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.txt

      - name: Debug - list APK outputs
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== apk output dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir not found"
          echo "=== apk output root ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk dir not found"
          echo "=== build outputs ==="
          find app/build/outputs -type d 2>/dev/null | head -20

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
