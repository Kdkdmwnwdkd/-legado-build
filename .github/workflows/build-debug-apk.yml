name: Build Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
      - name: Build web
        run: |
          cd modules/web
          npm install
          npm run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleAppDebug -Pabi=arm64-v8a --no-daemon --max-workers=2 --stacktrace
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-debug
          files: app/build/outputs/apk/**/*.apk
          overwrite_files: true
