name: Emulator Smoke

# 运行时冒烟测试：在 GitHub 的 Linux runner 上起一个带 KVM 加速的 Android
# 模拟器，真的把 APK 装上、启动、走完首启引导、逐个切底部 tab，截图并抓 crash。
#
# 只手动触发。构建 + 模拟器约 10 分钟，不适合放进每次 push 的常规 CI；
# 在动过工具链、依赖版本、启动路径之后跑一次即可。
#
# 覆盖不到的部分：相机（扫码）、音频（TTS）、真实网络环境、备份恢复。
# 模拟器没有摄像头，扫码页只能验证"打得开"，验证不了"扫得出"。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Tune memory for CI
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      # 模拟器是 x86_64，必须打出对应 ABI 的包；arm64 包装不进 x86 模拟器。
      - name: Assemble x86_64 debug
        run: ./gradlew :app:assembleAppDebug -Pabi=x86_64 --max-workers=2 --stacktrace

      - name: Inspect APK
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK=$APK"
          ls -lh "$APK"
          echo "--- native libs ---"
          unzip -l "$APK" | grep -E '\.so$' || echo '(apk 内没有 .so)'

      - name: Emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload x86_64 debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-x86_64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: |
            shot-*.png
            logcat.txt
          if-no-files-found: warn
