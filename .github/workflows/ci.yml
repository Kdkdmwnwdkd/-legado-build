name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 单元测试此前从未在 CI 跑过，先允许失败一段时间观察稳定性，
      # 稳定的做法是修完后把 continue-on-error 去掉。
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew test --stacktrace

      # 编译是硬性门槛：能打出 debug 包才允许合并。
      - name: Assemble debug
        run: ./gradlew :app:assembleAppDebug -Pabi=arm64-v8a --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
