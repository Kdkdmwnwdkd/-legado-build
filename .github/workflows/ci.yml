name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译是硬性门槛：能打出 debug 包才允许合并。
  # 注意：job 名会成为 GitHub 上的检查项名称，分支保护按名字匹配。
  # 这里统一加 "CI / " 前缀，避免和 web.yml 的 build 重名。
  build:
    name: CI / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Tune memory for CI
        # 37 万行 Kotlin + Compose/KSP，默认堆在标准 runner 上会 OOM
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      - name: Prepare Gradle distribution
        # GitHub 的 gradle-distributions release 资产偶发 504，
        # 官方源探测失败就切国内镜像，避免整条流水线卡在 wrapper 下载。
        run: |
          OFFICIAL="https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          MIRRORS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.6.0-bin.zip"
            "https://repo.huaweicloud.com/gradle/gradle-9.6.0-bin.zip"
          )
          probe() { curl -fsL -r 0-65535 --max-time 25 -o /dev/null "$1"; }
          if probe "$OFFICIAL"; then
            echo "官方源可用"
            exit 0
          fi
          for M in "${MIRRORS[@]}"; do
            if probe "$M"; then
              echo "切换镜像: $M"
              sed -i "s#^distributionUrl=.*#distributionUrl=${M}#" gradle/wrapper/gradle-wrapper.properties
              exit 0
            fi
          done
          echo "所有源均不可用，交给 wrapper 自行重试"

      - name: Assemble debug
        run: ./gradlew :app:assembleAppDebug -Pabi=arm64-v8a --max-workers=2 --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  # 单测与编译分开，避免个别会挂起的用例把编译验证一起拖死。
  # 实测单变体下 12 分钟跑完且全绿，所以这里不再允许失败——
  # 能过才是合并门槛，否则这条 job 没有意义。
  test:
    name: CI / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Tune memory for CI
        # 37 万行 Kotlin + Compose/KSP，默认堆在标准 runner 上会 OOM
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      - name: Prepare Gradle distribution
        # GitHub 的 gradle-distributions release 资产偶发 504，
        # 官方源探测失败就切国内镜像，避免整条流水线卡在 wrapper 下载。
        run: |
          OFFICIAL="https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          MIRRORS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.6.0-bin.zip"
            "https://repo.huaweicloud.com/gradle/gradle-9.6.0-bin.zip"
          )
          probe() { curl -fsL -r 0-65535 --max-time 25 -o /dev/null "$1"; }
          if probe "$OFFICIAL"; then
            echo "官方源可用"
            exit 0
          fi
          for M in "${MIRRORS[@]}"; do
            if probe "$M"; then
              echo "切换镜像: $M"
              sed -i "s#^distributionUrl=.*#distributionUrl=${M}#" gradle/wrapper/gradle-wrapper.properties
              exit 0
            fi
          done
          echo "所有源均不可用，交给 wrapper 自行重试"

      - name: Unit tests
        # 只跑 debug 变体：gradlew test 会同时编译 debug/release 两套 Kotlin，
        # 标准 runner 上内存扛不住（两套 IR lowering 并行会 OOM）。
        run: ./gradlew :app:testAppDebugUnitTest --max-workers=2 --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
